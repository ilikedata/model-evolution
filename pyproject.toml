[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "model-evolution"
version = "0.1.0"
description = "Git-backed research provenance and immutable artifact lineage for model development"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tai Elliott", email = "tai@machinelearning.com.au"}]
keywords = ["machine-learning", "research", "provenance", "lineage", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6,<7",
    "tqdm>=4,<5",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=3,<4"]
dev = [
    "build>=1,<2",
    "ruff>=0.12,<1",
    "twine>=6,<8",
]

[project.scripts]
model-evolution = "model_evolution.cli:main"

[project.urls]
Homepage = "https://github.com/ilikedata/model-evolution"
Documentation = "https://github.com/ilikedata/model-evolution#readme"
Issues = "https://github.com/ilikedata/model-evolution/issues"
Source = "https://github.com/ilikedata/model-evolution"

[tool.setuptools.packages.find]
include = ["model_evolution*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
