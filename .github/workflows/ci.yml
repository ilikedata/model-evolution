name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,gcs]"
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build distributions
        run: make build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/model-evolution-smoke"
          "$RUNNER_TEMP/model-evolution-smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/model-evolution-smoke/bin/model-evolution" --help
